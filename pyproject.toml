[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-search-mcp"
version = "0.1.0"
description = "把 DeepSeek 的 Search / Fetch 接口包装成 MCP 工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
deepseek-search-mcp = "deepseek_search_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
